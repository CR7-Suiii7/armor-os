# WirePlumber Lua / Conf Microphone Access Control Policy
# Restricts Audio/Source node links to verified enterprise applications only.

wireplumber.settings = {
  ["bluetooth.autoswitch-to-headset-profile"] = false,
}

access.rules = [
  {
    matches = [
      {
        application.process.binary = "firefox-esr"
      }
    ]
    actions = {
      default_permissions = "rx"
    }
  },
  {
    matches = [
      {
        # Default policy: block capture access for all other applications
        media.class = "Audio/Source"
      }
    ]
    actions = {
      default_permissions = "none"
    }
  }
]
