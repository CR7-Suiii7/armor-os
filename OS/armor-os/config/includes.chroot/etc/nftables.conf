#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow established and related connections
        ct state established,related accept

        # Drop invalid state packets
        ct state invalid drop

        # Loopback interface
        iifname "lo" accept

        # ICMP echo-request (ping) rate limited
        ip protocol icmp icmp type echo-request limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 5/second accept

        # Default drop everything else with logging
        log prefix "[NFTABLES-DROP-IN]: " flags all counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        # Allow loopback
        oifname "lo" accept

        # Allow established and related
        ct state established,related accept

        # DNS resolution (UDP/TCP 53)
        udp dport 53 accept
        tcp dport 53 accept

        # NTP time sync (UDP 123)
        udp dport 123 accept

        # Web browsing & updates (HTTP 80 / HTTPS 443)
        tcp dport { 80, 443 } accept

        # Email IMAP / POP3 / SMTP SSL/TLS ports for Thunderbird
        tcp dport { 465, 587, 993, 995 } accept

        # Default drop with log
        log prefix "[NFTABLES-DROP-OUT]: " flags all counter drop
    }
}
